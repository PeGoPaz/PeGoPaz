name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links and badges
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --timeout 20 --retry-wait-time 5 --max-retries 2 README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
